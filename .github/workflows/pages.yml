name: Publicar prototipo (rediseño) en GitHub Pages

# Publica SOLO la carpeta rediseno/ como vista previa del prototipo.
# No reemplaza el sitio oficial del club.
on:
  push:
    branches: [feat/4-rediseno-A]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto (carpeta rediseno)
        uses: actions/upload-pages-artifact@v3
        with:
          path: rediseno
      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
